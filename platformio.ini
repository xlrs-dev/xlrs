; Clean PlatformIO-only RP2040 + SX1280 LoRa TX/RX firmware.

[platformio]
default_envs = tx_lora_pico, rx_lora_pico

[lora_pico_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    jgromes/RadioLib@^7.4.0
build_flags =
    -DDEFAULT_BINDING_PHRASE=\"Kikobot-02\"
    -DCRSF_UART_TX_PIN=8
    -DCRSF_UART_RX_PIN=9
    -DCRSF_UART_BAUD=400000
    -DRF_FIXED_CHANNEL=0
    -DSX128X_SPI_SCK=18
    -DSX128X_SPI_MOSI=19
    -DSX128X_SPI_MISO=16
    -DSX128X_SPI_CS=17
    -DSX128X_SPI_BUSY=20
    -DSX128X_SPI_DIO1=21
    -DSX128X_SPI_RST=22
    -DSX128X_RXEN=14
    -DSX128X_TXEN=15
    -DSTATUS_LED_PIN=25
    -DENABLE_PICOTOOL_USB

[env:tx_lora_pico]
extends = lora_pico_base
build_flags =
    ${lora_pico_base.build_flags}
    -DLORA_TX_ROLE=1
build_src_filter =
    +<main.cpp>
    +<protocol.cpp>
    -<rc_rp2350_crsf_main.cpp>

[env:tx_usb_diag]
extends = lora_pico_base
build_flags =
    ${lora_pico_base.build_flags}
    -DLORA_TX_ROLE=1
    -DLORA_USB_DIAG=1
build_src_filter =
    +<main.cpp>
    +<protocol.cpp>
    -<rc_rp2350_crsf_main.cpp>

[env:tx_crsf_diag]
extends = lora_pico_base
build_flags =
    ${lora_pico_base.build_flags}
    -DLORA_TX_ROLE=1
    -DLORA_CRSF_DIAG=1
build_src_filter =
    +<main.cpp>
    +<protocol.cpp>
    -<rc_rp2350_crsf_main.cpp>

[env:rx_lora_pico]
extends = lora_pico_base
build_flags =
    ${lora_pico_base.build_flags}
    -DLORA_RX_ROLE=1
build_src_filter =
    +<main.cpp>
    +<protocol.cpp>
    -<rc_rp2350_crsf_main.cpp>

[env:rc-rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags =
    -DCRSF_UART_TX_PIN=8
    -DCRSF_UART_RX_PIN=9
    -DCRSF_UART_BAUD=400000
    -DRC_CRSF_SIMPLETX_FRAME_US=10000u
    -DENABLE_PICOTOOL_USB
build_src_filter =
    +<rc_rp2350_crsf_main.cpp>
    +<protocol.cpp>
    -<main.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -DUNIT_TEST=1
